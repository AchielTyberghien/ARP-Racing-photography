events {}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    error_log     /var/log/nginx/error.log debug;
    access_log    /var/log/nginx/access.log;

    # arpracing.be via Cloudflare Tunnel — plain HTTP, no redirect
    server {
        listen 443;
        server_name arpracing.be;

        # Angular frontend
        location / {
            root /usr/share/nginx/html/arpweb_ng_v19/browser;
            index index.html;
            try_files $uri /index.html;
        }
        # Backend API
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # n8n UI
        location /n8n/ {
            proxy_pass http://n8n:5678/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Old duckdns domain — redirect to HTTPS (keep only if still needed)
    server {
        listen 80;
        server_name arpracing.duckdns.org;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name arpracing.duckdns.org;
        ssl_certificate /etc/letsencrypt/live/arpracing.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/arpracing.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            root /usr/share/nginx/html/arpweb_ng_v19/browser;
            index index.html;
            try_files $uri /index.html;
        }
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /n8n/ {
            proxy_pass http://n8n:5678/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}